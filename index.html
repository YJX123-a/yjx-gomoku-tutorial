<div id="root"></div>
<script>
(function(){
  function findBadgeRoot(el){
    if(!el||el.nodeType!==1)return null;
    if((el.textContent||"").indexOf("豆包")===-1)return null;
    var target=null,node=el;
    while(node&&node!==document.documentElement){
      var s=window.getComputedStyle(node);
      if(s.position==="fixed")target=node;
      node=node.parentElement;
    }
    return target;
  }
  function scanAndRemove(nodes){
    for(var i=0;i<nodes.length;i++){
      var node=nodes[i];
      if(node.nodeType!==1)continue;
      var root=findBadgeRoot(node);
      if(root){root.remove();continue;}
      var desc=node.getElementsByTagName("*");
      for(var j=0;j<desc.length;j++){
        root=findBadgeRoot(desc[j]);
        if(root){root.remove();break;}
      }
    }
  }
  scanAndRemove(document.body.children);
  new MutationObserver(function(muts){
    for(var i=0;i<muts.length;i++)scanAndRemove(muts[i].addedNodes);
  }).observe(document.documentElement,{childList:true,subtree:true});
  setTimeout(function(){scanAndRemove(document.body.children);},500);
  setTimeout(function(){scanAndRemove(document.body.children);},2000);
})();
</script>
